<rect x="398" y="640" width="228" height="384" fill="url(#path)" filter="url(#blur28)"/>
<g mask="url(#fadeMask)" opacity="0.12"><use href="#boat" transform="translate(512,712) scale(1.02,-1.02) translate(-512,-742)" filter="url(#blur8)"/></g>
