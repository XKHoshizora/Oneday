<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="640" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0B1626"/><stop offset="0.5" stop-color="#16243A"/><stop offset="1" stop-color="#4A3B3C"/></linearGradient>
<radialGradient id="glow" cx="512" cy="640" r="520" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E79A5E" stop-opacity="0.55"/><stop offset="0.5" stop-color="#8A5A4A" stop-opacity="0.25"/><stop offset="1" stop-color="#8A5A4A" stop-opacity="0"/></radialGradient>
<radialGradient id="sun" cx="512" cy="640" r="328" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFE2A6"/><stop offset="0.45" stop-color="#FDB463"/><stop offset="1" stop-color="#E57E3E"/></radialGradient>
<linearGradient id="water" x1="0" y1="640" x2="0" y2="1024" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1C2C43"/><stop offset="0.45" stop-color="#142236"/><stop offset="1" stop-color="#0D1726"/></linearGradient>
<linearGradient id="path" x1="0" y1="640" x2="0" y2="1000" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F4A562" stop-opacity="0.75"/><stop offset="1" stop-color="#F4A562" stop-opacity="0"/></linearGradient>
<linearGradient id="flapL" x1="0" y1="556" x2="0" y2="742" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#DCE3EA"/><stop offset="1" stop-color="#AFBCCB"/></linearGradient><linearGradient id="flapR" x1="0" y1="556" x2="0" y2="742" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#AEBBCA"/><stop offset="1" stop-color="#8495A9"/></linearGradient><linearGradient id="pocket" x1="0" y1="606" x2="0" y2="742" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B49880"/><stop offset="1" stop-color="#6E7F93"/></linearGradient><linearGradient id="sailL" x1="0" y1="288" x2="0" y2="606" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F4F1EC"/><stop offset="1" stop-color="#F8DDBA"/></linearGradient><linearGradient id="sailR" x1="0" y1="288" x2="0" y2="606" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E2CDB8"/><stop offset="1" stop-color="#EFB27C"/></linearGradient>
<linearGradient id="fade" x1="0" y1="712" x2="0" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
