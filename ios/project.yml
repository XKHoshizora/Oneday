name: Oneday
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  Oneday:
    type: application
    platform: iOS
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Oneday
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    sources:
      - path: App
        excludes: [Resources]
      - path: Shared
      - path: App/Resources/Web
        type: folder
        buildPhase: resources
      - path: App/Resources/Licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.xkhoshizora.oneday
        PRODUCT_NAME: Oneday
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Oneday
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        CODE_SIGN_ENTITLEMENTS: App/Oneday.entitlements
    dependencies:
      - target: PacketTunnel
        embed: true
      - sdk: NetworkExtension.framework
      - sdk: WebKit.framework
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
      - path: ThirdParty/ClashAdapter
        excludes: [LICENSE]
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Oneday VPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.xkhoshizora.oneday.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - framework: Frameworks/Clash.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: NetworkExtension.framework
  OnedayIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Oneday
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.xkhoshizora.oneday.IntegrationTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Oneday.app/Oneday
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Oneday:
    build:
      targets:
        Oneday: all
        PacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - OnedayIntegrationTests
